[build]
  # No build command needed - it's just static HTML/CSS/JS
  publish = "."
  functions = "netlify/functions"

[functions]
  # Use Node.js 18 for the serverless functions
  node_bundler = "esbuild"
  # Include Supabase client for scheduled functions
  external_node_modules = ["@supabase/supabase-js"]

# Scheduled function: runs every 5 minutes to track PCC trolleys
[functions."pcc-tracker"]
  schedule = "*/5 * * * *"

# Scheduled function: runs daily at 4 AM Eastern to compute daily summary
[functions."pcc-daily-summary"]
  schedule = "0 9 * * *"

# Redirect for cleaner URLs
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Keep project internals off the public site (source, docs, native app project).
# Added 2026-08-15. These are 404s, not secrets; the site publishes the repo root.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/native/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
